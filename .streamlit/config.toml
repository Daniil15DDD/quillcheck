[server]
address = "127.0.0.1"
port = 8502
headless = true
# The watcher walks every imported module, including transformers' optional vision
# modules, and logs a traceback for each missing torchvision import. Not needed here.
fileWatcherType = "none"

[client]
toolbarMode = "minimal"  # no "Deploy" button; this app is local only

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[theme]
font = "sans-serif"
baseRadius = "0.75rem"

[theme.light]
primaryColor = "#4338ca"
backgroundColor = "#f3f4f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#171a2b"

[theme.dark]
primaryColor = "#6366f1"
backgroundColor = "#0e0f1c"
secondaryBackgroundColor = "#181a2e"
textColor = "#e8e9f3"
